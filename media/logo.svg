  </filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
  </filter>
  <clipPath id="flaskClip">
    <path d="M232 150 h48 v58 a92 92 0 1 1 -48 0 z"/>
  </clipPath>
  <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#ffd36a"/>
