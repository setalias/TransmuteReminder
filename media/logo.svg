  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffc83a" stop-opacity="0.75"/>
    <stop offset="55%" stop-color="#ff9a1a" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#ff9a1a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gemBlue" cx="40%" cy="35%"><stop offset="0%" stop-color="#bfe6ff"/><stop offset="100%" stop-color="#1d5fbf"/></radialGradient>
  <radialGradient id="gemRed" cx="40%" cy="35%"><stop offset="0%" stop-color="#ffc1b8"/><stop offset="100%" stop-color="#b3201a"/></radialGradient>
  <radialGradient id="gemGreen" cx="40%" cy="35%"><stop offset="0%" stop-color="#c9ffd0"/><stop offset="100%" stop-color="#1f8f3a"/></radialGradient>
  <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8f1d1d"/>
    <stop offset="50%" stop-color="#6b1212"/>
    <stop offset="100%" stop-color="#3f0909"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
