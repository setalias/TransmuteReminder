<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="60%">
    <stop offset="0%" stop-color="#3b2a5c"/>
    <stop offset="65%" stop-color="#1c1430"/>
    <stop offset="100%" stop-color="#0c0814"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff1b0"/>
    <stop offset="28%" stop-color="#f2c14e"/>
    <stop offset="55%" stop-color="#b8801c"/>
    <stop offset="78%" stop-color="#f0c35a"/>
    <stop offset="100%" stop-color="#7a5212"/>
